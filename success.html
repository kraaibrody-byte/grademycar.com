<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful - GradeMyCar</title>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <script src="/attribution.js"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .success-container {
            background: white;
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        
        .success-icon {
            font-size: 4rem;
            color: #10b981;
            margin-bottom: 1rem;
        }
        
        #session-id {
            word-break: break-all;
            overflow-wrap: anywhere;
            text-align: right; /* ADD THIS */
        }

        .success-title {
            font-size: 2rem;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 1rem;
        }
        
        .success-message {
            font-size: 1.1rem;
            color: #6b7280;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        
        .return-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 1rem 2rem;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        
        .return-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }
        
        .details {
            background: #f9fafb;
            padding: 1.5rem;
            border-radius: 12px;
            margin: 2rem 0;
            text-align: left;
        }
        
        .details-title {
            font-weight: 600;
            color: #374151;
            margin-bottom: 1rem;
        }
        
        .details-item {
            display: flex;
            justify-content: space-between;
            align-items: flex-start; /* ADD THIS */
            margin-bottom: 0.5rem;
            color: #6b7280;
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="success-container">
        <div class="success-icon">🎉</div>
        <h1 class="success-title">Payment Successful!</h1>
        <p class="success-message">
            Thank you for your purchase! Your credits are being added to your account.
        </p>
        
        <div class="details">
            <div class="details-title">Purchase Details</div>
            <div class="details-item">
                <span>Bundle:</span>
                <span id="bundle-name">Loading...</span>
            </div>
            <div class="details-item">
                <span>Credits:</span>
                <span id="bundle-credits">Loading<div class="loading"></div></span>
            </div>
            <div class="details-item">
                <span>Amount:</span>
                <span id="bundle-amount">Loading...</span>
            </div>
            <div class="details-item">
                <span>Session ID:</span>
                <span id="session-id">Loading...</span>
            </div>
        </div>
        
        <a href="/" class="return-btn" id="return-btn">Return to GradeMyCar</a>
    </div>

    <script>
        // Buyers who started checkout in the phone app (phone.html) go back there
        try {
            var r = localStorage.getItem('gmc_return') || '';
            if (r.indexOf('phone:') === 0 && Date.now() - Number(r.slice(6)) < 3600000) {
                document.getElementById('return-btn').href = '/phone.html?purchased=1';
                document.getElementById('return-btn').textContent = 'Back to the App';
            }
            localStorage.removeItem('gmc_return');
        } catch (e) {}
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
        import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-functions.js";
        import { getAnalytics, logEvent, setUserId, setUserProperties } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-analytics.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCsVQCXfyRFt7fpcE-5Xvm_P3bULlGYMIU",
            authDomain: "grademycar.firebaseapp.com",
            databaseURL: "https://grademycar-default-rtdb.firebaseio.com",
            projectId: "grademycar",
            storageBucket: "grademycar.firebasestorage.app",
            messagingSenderId: "724919836813",
            appId: "1:724919836813:web:ca0ccd5bfe7ae3de3502c4",
            measurementId: "G-TT0RZ0WFN0"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const functions = getFunctions(app);

        // Same rules as the app: nothing from localhost or ?gmc_test=1 browsers;
        // ?internal=1 devices are tagged (see attribution.js)
        const GA = window.GMCAttribution;
        const NO_ANALYTICS = !GA || GA.analyticsOff();
        const analytics = NO_ANALYTICS ? null : getAnalytics(app);
        if (analytics && GA.internal()) { try { setUserProperties(analytics, { internal_user: 'true' }); } catch (e) {} }

        // purchase is logged only after the server has checked with Stripe that this
        // session is paid and belongs to this user, and only once per session in this
        // browser (refreshing the page doesn't log it again). The Stripe webhook also
        // sends it server-side with the same transaction_id, which GA uses to dedupe.
        function logPurchase(purchase, uid) {
            const key = 'gmc_purchase_logged:' + purchase.transaction_id;
            try { if (localStorage.getItem(key)) return; } catch (e) {}
            const params = Object.assign({ app: 'web', source: 'web' }, GA ? GA.common() : {}, purchase);
            if (NO_ANALYTICS) console.debug('[GMC track] purchase', params);
            else { try { setUserId(analytics, uid); logEvent(analytics, 'purchase', params); } catch (e) {} }
            try { localStorage.setItem(key, String(Date.now())); } catch (e) {}
        }

        const sessionId = new URLSearchParams(window.location.search).get('session_id');
        const verify = httpsCallable(functions, 'verifyPurchase');

        if (sessionId) {
            document.getElementById('session-id').textContent = sessionId;
            onAuthStateChanged(auth, async (user) => {
                if (!user) { window.location.href = '/?login=required'; return; }
                let res = null;
                // Stripe marks the session paid before redirecting here; one retry covers a slow network
                for (let i = 0; i < 2 && !res; i++) {
                    try { res = (await verify({ sessionId })).data; }
                    catch (e) { console.error('verifyPurchase failed:', e); if (i === 0) await new Promise(r => setTimeout(r, 2000)); }
                }
                if (!res) return;
                if (!res.paid) {
                    document.querySelector('.success-title').textContent = 'Payment processing…';
                    return;
                }
                document.querySelector('.success-title').textContent = 'Payment Successful!';
                const d = res.display;
                document.getElementById('bundle-amount').textContent =
                    `$${(d.amount_total / 100).toFixed(2)} ${String(d.currency).toUpperCase()}`;
                document.getElementById('bundle-name').textContent = d.description;
                if (d.credits) {
                    const c = parseInt(d.credits, 10);
                    document.getElementById('bundle-credits').textContent = c > 0 ? `${c} credits` : 'Unlimited Access';
                }
                logPurchase(res.purchase, user.uid);
            });
        } else {
            // No session ID, probably accessed directly
            window.location.href = '/';
        }
    </script>
</body>
</html>
